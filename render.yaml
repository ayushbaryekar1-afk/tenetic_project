services:
  - type: web
    name: tenetic-super-agent-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000"
